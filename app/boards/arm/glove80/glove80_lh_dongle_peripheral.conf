# Extra Kconfig fragment (not part of glove80_lh_defconfig on purpose):
# builds the Glove80 left half as a plain BLE split peripheral instead of
# the central, for use together with the glove80_dongle shield.
#
# Apply it only when building the dongle-mode LH firmware, e.g.:
#   west build -b glove80_lh -- -DEXTRA_CONF_FILE=glove80_lh_dongle_peripheral.conf
# or via the `kconfig` override on the `zmk` derivation in default.nix.
#
# Do not merge this into glove80_lh_defconfig - that would make LH a
# peripheral even when no dongle is present, breaking the normal build.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
