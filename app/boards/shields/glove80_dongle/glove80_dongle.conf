# Use higher radio transmit power, matching the Glove80 halves. This is a
# choice-group symbol, so it must be set as a value here rather than as a
# `default` in Kconfig.defconfig (which has no effect on choice members and
# is treated as a fatal Kconfig warning).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Kconfig.defaults sets CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y as a project-wide
# default whenever CONFIG_ZMK_RGB_UNDERGLOW is on, on the assumption a board
# with underglow also has ext_power circuitry to gate. We enable RGB_UNDERGLOW
# on the dongle solely so &rgb_ug's device exists locally on the central (see
# glove80_dongle.overlay) - the dongle has no ext_power hardware at all, and
# leaving this on tries to reference a nonexistent zmk,ext-power-generic
# devicetree node, which is a compile error (same class of bug as the
# zmk,battery chosen property - see the overlay), not a graceful no-op.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
