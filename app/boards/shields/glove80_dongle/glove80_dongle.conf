# Use higher radio transmit power, matching the Glove80 halves. This is a
# choice-group symbol, so it must be set as a value here rather than as a
# `default` in Kconfig.defconfig (which has no effect on choice members and
# is treated as a fatal Kconfig warning).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER is left at its Kconfig.defaults default
# (y, whenever CONFIG_ZMK_RGB_UNDERGLOW is on) rather than disabled here.
# src/rgb_underglow.c's critical-battery auto-off path reads the ext_power
# device unconditionally, not gated by this Kconfig option, so disabling it
# just traded a "device not declared" compile error for an "undeclared
# variable" one. See the placeholder zmk,ext-power-generic node in
# glove80_dongle.overlay this depends on instead.

# Tried CONFIG_ZMK_USB_LOGGING=y here to help diagnose the peer-battery relay
# bug, but it hits a fatal Kconfig dependency violation on this board
# (USB_CDC_ACM needs DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED, which isn't
# satisfied here) - not worth chasing right now. Using LED-color-coded
# diagnostics in rgb_underglow.c instead; see UGDBG comments there.
