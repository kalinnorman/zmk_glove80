# Use higher radio transmit power, matching the Glove80 halves. This is a
# choice-group symbol, so it must be set as a value here rather than as a
# `default` in Kconfig.defconfig (which has no effect on choice members and
# is treated as a fatal Kconfig warning).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
